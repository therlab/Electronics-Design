# OpenOCD config for MSPM0G3507 via CMSIS-DAP (DAP-Link)
# No nRESET pin needed - uses software reset

source [find interface/cmsis-dap.cfg]
adapter speed 500
transport select swd

# Override board reset to use software reset (no nRST wire)
proc mspm0_board_reset {} {
    echo "Software reset via SYSRESETREQ..."
    set user_reset_config [reset_config]
    reset_config sysresetreq
    set errno [catch {reset}]
    eval reset_config $user_reset_config
    if {$errno} {error}
}

source [find target/ti/mspm0.cfg]

# Init
init
sleep 500

# Try factory reset first (requires DSSM)
echo "Attempting mass erase via debug interface..."
catch { mspm0_mass_erase }

echo "Attempting to program flash..."
reset halt
program "keil/Objects/empty_LP_MSPM0G3507_nortos_keil.hex" verify

echo "Reset and run..."
reset run
shutdown
